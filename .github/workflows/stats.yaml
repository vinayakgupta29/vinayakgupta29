name: Metrics

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest

    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.STATS_TOKEN }}
          user: vinayakgupta29

          base: header, activity, community, repositories, metadata

          plugin_languages: yes
          plugin_languages_limit: 20

          filename: metrics.svg

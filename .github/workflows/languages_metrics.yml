name: Language Metrics

on:
  schedule:
    - cron: "30 0 * * *" # Every day at 00:30 UTC or 06:00 IST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  language-metrics:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: |
          python -m pip install requests

      - name: Generate language metrics
        env:
          STATS_TOKEN: ${{ secrets.STATS_TOKEN }}

          LANGUAGE_LIMIT: 10
          LANGUAGES_IGNORE: html, css, cmake, shell, qml, ocaml

          SVG_FILE: language-metrics.svg

        run: |
          python scripts/language_stats_svg.py

      - name: Commit SVG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add language-metrics.svg

          git diff --cached --quiet || \
            git commit -m "Update language metrics"

          git push
